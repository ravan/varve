[package]
name = "varve-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client (varve shell, JSONL import/export, admin) for Varve, the bitemporal graph database."

[[bin]]
name = "varve"
path = "src/main.rs"

[dependencies]
varve = { path = "../varve", version = "0.1.0" }
varve-gql = { path = "../varve-gql", version = "0.1.0" }
varve-server = { path = "../varve-server", version = "0.1.0", default-features = false, features = [
    "bulk",
] }
serde = { workspace = true }
serde_json = { workspace = true }
arrow = { workspace = true }
arrow-json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
# fs + io-util + io-std: stream a file/stdin as the reqwest bulk-ingest body.
tokio = { workspace = true, features = ["fs", "io-util", "io-std"] }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
clap = { workspace = true }
rustyline = { workspace = true }

[dev-dependencies]
varve-server = { path = "../varve-server", default-features = false, features = [
    "http",
] }
axum = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
